[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dscr-tools"
version = "0.2.0"
description = "Python toolkit for loan amortization, DSCR tracking, covenant monitoring, and loan sizing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://jaypatel1511.github.io/cdfi-superpowers/"
Repository = "https://github.com/Jaypatel1511/dscr-tools"
Documentation = "https://github.com/Jaypatel1511/dscr-tools#readme"
Issues = "https://github.com/Jaypatel1511/dscr-tools/issues"
